<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/style.css">
    <title>LibraHub - Borrowing</title>
</head>
<body>
<header>
    <div class="header-container">
        <div class="icon">
            <i class="fa-solid fa-book-open"></i>
            <h2>LibraHub</h2>
        </div>
        <div class="heah_link">
            <p class="search-p">Admin Panel</p>
            <a href="dashbord.html" class="serch-links a-login"><button class="dash-btn Dash-buuton">Dash Board</button></a>
            <a href="search.html" class="serch-links a-register"><button class="dash-btn search-buuton">Search</button></a>
            <a href="add.html" class="serch-links a-login"><button class="dash-btn search-buuton">Add Book</button></a>
            <a href="addUser.html" class="serch-links a-login"><button class="dash-btn search-buuton">Add User</button></a>
            <a href="index.html" class="serch-links a-register"><button class="log-out-btn search-buuton">Log out <i class="fa-solid fa-right-from-bracket"></i></button></a>
        </div>
    </div>
</header>

<section class="brrow-form">
    <div class="brrow-card">
        <h2 class="brroe-tital">Borrow a Book</h2>

        <p class="p-selectuser">Select User</p>
        <select id="userDropdown" class="select_User">
            <option value="" hidden>--- Choose a User ---</option>
        </select>

        <p class="p-selectbook">Select Book</p>
        <select id="bookDropdown" class="select_Book">
            <option value="" disabled>Loading books...</option>
        </select>

        <div class="borrow-date">
            <div class="right-date">
                <p class="p-borrodate">Borrow Date</p>
                <input type="date" id="borrowDateInput">
            </div>
            <div class="left-date">
                <p class="p-borrodate">Due Date</p>
                <input type="date" id="dueDateInput">
            </div>
        </div>

        <div class="borrow-btn">
            <button class="request-btn" id="submitBorrow">Request Borrowing</button>
            <button class="cancel-btn" onclick="window.location.reload()">Cancel</button>
        </div>
    </div>
</section>

<script src="JS/db.js"></script>
<script>
    const GOOGLE_API_KEY = "AIzaSyDzCjBHkVwA42wQ3tSu9NN7C7trho7xTDA";
    const userSelect = document.getElementById('userDropdown');
    const bookSelect = document.getElementById('bookDropdown');
    const submitBtn  = document.getElementById('submitBorrow');

    // ── Load Members from localStorage ───────────────────
    DB.getMembers().forEach(member => {
        const opt = document.createElement('option');
        opt.value       = member.id;
        opt.textContent = member.name;
        userSelect.appendChild(opt);
    });

    // ── Load Books from Google Books API ─────────────────
    async function loadBooks() {
        try {
            const url      = `https://www.googleapis.com/books/v1/volumes?q=subject:fiction&maxResults=40&printType=books&orderBy=relevance&key=${GOOGLE_API_KEY}`;
            const response = await fetch(url);
            const data     = await response.json();

            bookSelect.innerHTML = '<option value="" hidden>--- Choose a Book ---</option>';

            // أضف الكتب من localStorage أولاً
            DB.getBooks().forEach(book => {
                const opt = document.createElement('option');
                opt.value       = `local_${book.bookId}`;
                opt.textContent = book.title;
                opt.dataset.title  = book.title;
                opt.dataset.source = 'local';
                bookSelect.appendChild(opt);
            });

            // أضف كتب Google
            (data.items || []).forEach(item => {
                const info = item.volumeInfo;
                const opt  = document.createElement('option');
                opt.value          = `google_${item.id}`;
                opt.textContent    = info.title || 'Unknown Title';
                opt.dataset.title  = info.title || 'Unknown Title';
                opt.dataset.author = (info.authors || ['Unknown']).join(', ');
                opt.dataset.source = 'google';
                bookSelect.appendChild(opt);
            });

        } catch (err) {
            console.error("Failed to load books:", err);
            bookSelect.innerHTML = '<option value="" hidden>--- Could not load books ---</option>';
        }
    }

    // ── Submit Borrow ─────────────────────────────────────
    submitBtn.addEventListener('click', () => {
        const borrowDate = document.getElementById('borrowDateInput').value;
        const dueDate    = document.getElementById('dueDateInput').value;

        if (!userSelect.value || !bookSelect.value || !borrowDate || !dueDate) {
            alert("Please select a user, a book, and both dates.");
            return;
        }

        const selectedOpt = bookSelect.options[bookSelect.selectedIndex];
        const selectedUser = userSelect.options[userSelect.selectedIndex];

        const borrowing = {
            memberId:   userSelect.value,
            memberName: selectedUser.textContent,
            bookId:     bookSelect.value,
            title:      selectedOpt.dataset.title || selectedOpt.textContent,
            borrowDate: new Date(borrowDate).toISOString(),
            dueDate:    new Date(dueDate).toISOString()
        };

        // لو الكتاب من localStorage نقص نسخة
        if (selectedOpt.dataset.source === 'local') {
            try {
                const bookId = parseInt(bookSelect.value.replace('local_', ''));
                const books  = DB.getBooks();
                const idx    = books.findIndex(b => b.bookId === bookId);
                if (idx !== -1 && books[idx].availableCopies > 0) {
                    books[idx].availableCopies -= 1;
                    DB.saveBooks(books);
                }
            } catch (e) {}
        }

        const borrowings = DB.getBorrowings();
        borrowing.id = Date.now();
        borrowings.push(borrowing);
        DB.saveBorrowings(borrowings);

        alert("Book successfully borrowed!");
        window.location.href = "dashbord.html";
    });

    loadBooks();
</script>
</body>
</html>
